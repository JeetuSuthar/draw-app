name: Deploy the WS

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout the code
        uses: actions/checkout@v2

      - name:  Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name:  Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.ws
          push: true
          tags: jeetusuthar/draw-app-ws:${{ github.sha }}

      - name:  Deploy WS to VM
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key root@206.189.137.154 -t "
            docker stop draw_ws || true &&
            docker rm draw_ws || true &&
            docker pull jeetusuthar/draw-app-ws:${{ github.sha }} &&
            docker run --name draw_ws -d -p 8080:8080 \
              -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              jeetusuthar/draw-app-ws:${{ github.sha }}
          "
